name: Ruoka MCP
version: "0.18.2"
slug: ruoka
description: MCP server for Finnish grocery and alcohol search (K-Ruoka, S-Kaupat, Alko), exposed to Claude via Tailscale Funnel
url: https://github.com/Jameshooper/mcp-ruoka
arch:
  - amd64
  - aarch64
init: false
ingress: true
ingress_port: 3002
panel_icon: mdi:chef-hat
panel_title: Recipes
startup: application
options:
  mcp_auth_token: ""
  oauth_client_id: ""
  oauth_client_secret: ""
  tailscale_auth_key: ""
  tailscale_hostname: ruoka
  ui_allowed_logins: ""
  mcp_allowed_ips: ""
  default_store_id: "613756972"
  default_store_name: Prisma Linnainmaa
  claude_prompt_note: Always pass avoidAllergens for cashew, walnut and peanut.
schema:
  mcp_auth_token: password?
  oauth_client_id: password?
  oauth_client_secret: password?
  tailscale_auth_key: password?
  tailscale_hostname: str?
  ui_allowed_logins: str?
  mcp_allowed_ips: str?
  default_store_id: str?
  default_store_name: str?
  claude_prompt_note: str?
