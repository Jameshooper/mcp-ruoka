<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recipes</title>
<style>
:root {
  --bg: #f6f5f2; --card: #ffffff; --text: #1f2328; --muted: #6b7280; --line: #e3e1db;
  --accent: #c2410c; --star: #f59e0b; --star-off: #d6d3cc; --chip: #efece5;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141517; --card: #1e2024; --text: #e8e6e1; --muted: #9aa0a8; --line: #2e3238;
    --accent: #fb923c; --star: #fbbf24; --star-off: #3a3f46; --chip: #2a2d33;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 system-ui, sans-serif; }
main { max-width: 960px; margin: 0 auto; padding: 16px; }
h1 { font-size: 1.4rem; margin: 0 0 12px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
input, select, textarea, button { font: inherit; color: inherit; }
input[type=search], select, textarea, input[type=number] {
  background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
}
input[type=search] { flex: 1 1 220px; }
button { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.danger { color: #dc2626; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; cursor: pointer; }
.card:hover { border-color: var(--accent); }
.card h2 { font-size: 1.05rem; margin: 0 0 4px; }
.meta { color: var(--muted); font-size: .85rem; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { background: var(--chip); border-radius: 999px; padding: 2px 10px; font-size: .78rem; }
.stars { display: inline-flex; gap: 2px; }
.stars button { border: 0; background: none; padding: 0 1px; font-size: 1.5rem; line-height: 1; color: var(--star-off); }
.stars button.on { color: var(--star); }
.stars.static span { color: var(--star-off); font-size: 1rem; }
.stars.static span.on { color: var(--star); }
.empty { color: var(--muted); padding: 32px 0; text-align: center; }
.detail { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.detail h2 { margin: 0 0 4px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0; }
ul.ing { padding-left: 20px; }
ul.ing li.pantry { color: var(--muted); }
ol.steps { padding-left: 22px; }
ol.steps li { margin-bottom: 6px; }
textarea { width: 100%; min-height: 70px; }
.tabs { display: flex; gap: 8px; margin-bottom: 14px; }
.tabs button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.aisle { margin: 16px 0 4px; font-weight: 600; }
label.line { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; border-bottom: 1px solid var(--line); }
label.line.done span.text { text-decoration: line-through; color: var(--muted); }
label.line input { margin-top: 5px; width: 18px; height: 18px; flex: none; }
.price { margin-left: auto; white-space: nowrap; font-variant-numeric: tabular-nums; }
.issue { color: #b45309; margin: 2px 0; }
.ok { color: #15803d; }
.stat { display: inline-block; margin-right: 14px; }
.hidden { display: none; }
</style>
</head>
<body>
<main>
  <h1 id="title">Recipes</h1>
  <div class="tabs">
    <button type="button" id="tab-recipes" class="active">Recipes</button>
    <button type="button" id="tab-plans">Meal plans</button>
  </div>
  <div id="list-view">
    <div class="toolbar">
      <input type="search" id="search" placeholder="Search name, ingredient or tag">
      <select id="tag"><option value="">All tags</option></select>
      <select id="protein">
        <option value="">Any protein</option>
        <option value="white_meat">White meat</option>
        <option value="red_meat">Red meat</option>
        <option value="fish">Fish</option>
        <option value="vegetarian">Vegetarian</option>
        <option value="other">Other</option>
      </select>
      <select id="sort">
        <option value="rating">Best rated</option>
        <option value="name">Name</option>
        <option value="recent">Recently updated</option>
      </select>
    </div>
    <div id="grid" class="grid"></div>
    <div id="empty" class="empty hidden"></div>
  </div>
  <div id="detail-view" class="hidden"></div>
  <div id="plans-view" class="hidden">
    <div id="plan-grid" class="grid"></div>
    <div id="plan-empty" class="empty hidden"></div>
  </div>
  <div id="plan-detail-view" class="hidden"></div>
</main>
<script>
"use strict";
let recipes = [];

const $ = (id) => document.getElementById(id);

function el(tag, props, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props || {})) {
    if (key === "class") node.className = value;
    else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else node.setAttribute(key, value);
  }
  for (const child of children.flat()) {
    if (child !== null && child !== undefined) node.append(child);
  }
  return node;
}

async function api(path, options) {
  const response = await fetch(path, options);
  if (!response.ok) throw new Error((await response.json().catch(() => ({}))).error || response.statusText);
  return response.json();
}

function staticStars(rating) {
  const wrap = el("span", { class: "stars static", title: rating ? `${rating} / 5` : "Not rated" });
  for (let i = 1; i <= 5; i++) wrap.append(el("span", { class: i <= (rating || 0) ? "on" : "" }, "★"));
  return wrap;
}

const PROTEIN_LABEL = {
  white_meat: "White meat",
  red_meat: "Red meat",
  fish: "Fish",
  vegetarian: "Vegetarian",
  other: "Other",
};

function nutritionText(recipe) {
  const n = recipe.nutrition;
  if (!n) return "";
  const macros = n.carbsG !== undefined && n.fatG !== undefined
    ? ` · ${Math.round(n.carbsG)} g carbs · ${Math.round(n.fatG)} g fat`
    : "";
  return `${Math.round(n.kcal)} kcal · ${Math.round(n.proteinG)} g protein${macros} / portion`;
}

function matches(recipe, query, tag, protein) {
  if (protein && recipe.protein !== protein) return false;
  if (tag && !recipe.tags.some((t) => t.toLowerCase() === tag)) return false;
  if (!query) return true;
  const haystack = [recipe.name, ...recipe.tags, ...recipe.ingredients.flatMap((i) => [i.english, ...i.finnish])]
    .join(" ")
    .toLowerCase();
  return query.split(/\s+/).every((word) => haystack.includes(word));
}

function sorted(list, mode) {
  const copy = [...list];
  if (mode === "name") copy.sort((a, b) => a.name.localeCompare(b.name));
  else if (mode === "recent") copy.sort((a, b) => b.updatedAt.localeCompare(a.updatedAt));
  else copy.sort((a, b) => (b.rating || 0) - (a.rating || 0) || a.name.localeCompare(b.name));
  return copy;
}

function badges(recipe) {
  const items = [];
  if (recipe.protein) items.push(PROTEIN_LABEL[recipe.protein]);
  if (recipe.vegetables) items.push("Vegetables");
  items.push(...recipe.tags);
  return items.map((t) => el("span", { class: "chip" }, t));
}

function renderList() {
  const query = $("search").value.trim().toLowerCase();
  const tag = $("tag").value;
  const shown = sorted(
    recipes.filter((r) => matches(r, query, tag, $("protein").value)),
    $("sort").value,
  );
  const grid = $("grid");
  grid.replaceChildren(
    ...shown.map((r) =>
      el("div", { class: "card", onclick: () => showDetail(r.id) },
        el("h2", {}, r.name),
        staticStars(r.rating),
        el("div", { class: "meta" }, `${r.servings} servings · ${r.ingredients.length} ingredients`),
        el("div", { class: "meta" }, nutritionText(r)),
        el("div", { class: "chips" }, badges(r)),
      ),
    ),
  );
  const empty = $("empty");
  empty.classList.toggle("hidden", shown.length > 0);
  empty.textContent = recipes.length === 0
    ? "No recipes saved yet. Ask Claude to save one."
    : "No recipes match.";
}

function renderTags() {
  const select = $("tag");
  const current = select.value;
  const tags = [...new Set(recipes.flatMap((r) => r.tags.map((t) => t.toLowerCase())))].sort();
  select.replaceChildren(el("option", { value: "" }, "All tags"), ...tags.map((t) => el("option", { value: t }, t)));
  select.value = tags.includes(current) ? current : "";
}

async function load() {
  recipes = (await api("api/recipes")).recipes;
  renderTags();
  renderList();
}

function formatQuantity(q, factor) {
  if (!q) return "";
  const amount = Math.round(q.amount * factor * 100) / 100;
  return `${amount} ${q.unit}`;
}

async function showDetail(id) {
  const recipe = recipes.find((r) => r.id === id);
  if (!recipe) return;
  tab = "recipes";
  show("detail-view");
  const view = $("detail-view");

  const servings = el("input", { type: "number", min: "1", max: "100", value: String(recipe.servings), style: "width:80px" });
  const ingredients = el("ul", { class: "ing" });
  const drawIngredients = () => {
    const factor = (Number(servings.value) || recipe.servings) / recipe.servings;
    ingredients.replaceChildren(
      ...recipe.ingredients.map((i) =>
        el("li", { class: i.pantry ? "pantry" : "" },
          [formatQuantity(i.quantity, factor), i.english].filter(Boolean).join(" "),
          i.pantry ? " (pantry)" : "",
        ),
      ),
    );
  };
  servings.addEventListener("input", drawIngredients);
  drawIngredients();

  const review = el("textarea", { placeholder: "What worked, what to change" });
  review.value = recipe.review || "";
  const status = el("span", { class: "meta" });

  const save = async (rating) => {
    try {
      const updated = await api(`api/recipes/${encodeURIComponent(id)}/rating`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ rating, review: review.value }),
      });
      recipes = recipes.map((r) => (r.id === id ? updated : r));
      status.textContent = "Saved";
      drawStars(updated.rating || 0);
    } catch (error) {
      status.textContent = `Could not save: ${error.message}`;
    }
  };

  const stars = el("div", { class: "stars" });
  const drawStars = (rating) => {
    stars.replaceChildren(
      ...[1, 2, 3, 4, 5].map((n) =>
        el("button", { class: n <= rating ? "on" : "", title: `${n} star${n > 1 ? "s" : ""}`, onclick: () => save(n === rating ? null : n) }, "★"),
      ),
    );
  };
  drawStars(recipe.rating || 0);

  view.replaceChildren(
    el("div", { class: "row" }, el("button", { onclick: closeDetail }, "← Back")),
    el("div", { class: "detail" },
      el("h2", {}, recipe.name),
      el("div", { class: "chips" }, badges(recipe)),
      el("div", { class: "meta" }, nutritionText(recipe)),
      el("div", { class: "row" }, stars, status),
      el("div", { class: "row" }, el("label", {}, "Servings "), servings),
      el("h3", {}, "Ingredients"), ingredients,
      recipe.steps.length ? el("h3", {}, "Method") : null,
      recipe.steps.length ? el("ol", { class: "steps" }, recipe.steps.map((s) => el("li", {}, s))) : null,
      recipe.notes ? el("h3", {}, "Notes") : null,
      recipe.notes ? el("p", {}, recipe.notes) : null,
      el("h3", {}, "Your review"), review,
      el("div", { class: "row" },
        el("button", { class: "primary", onclick: () => save(recipe.rating || null) }, "Save review"),
        el("button", { class: "danger", onclick: () => remove(recipe) }, "Delete recipe"),
      ),
    ),
  );
  window.scrollTo(0, 0);
}

let tab = "recipes";

function show(viewId) {
  for (const id of ["list-view", "detail-view", "plans-view", "plan-detail-view"]) {
    $(id).classList.toggle("hidden", id !== viewId);
  }
  $("title").textContent = tab === "plans" ? "Meal plans" : "Recipes";
  $("tab-recipes").classList.toggle("active", tab === "recipes");
  $("tab-plans").classList.toggle("active", tab === "plans");
}

function closeDetail() {
  tab = "recipes";
  show("list-view");
  renderList();
}

async function remove(recipe) {
  if (!confirm(`Delete "${recipe.name}"? This cannot be undone.`)) return;
  await api(`api/recipes/${encodeURIComponent(recipe.id)}`, { method: "DELETE" });
  recipes = recipes.filter((r) => r.id !== recipe.id);
  renderTags();
  closeDetail();
}

let plans = [];

const euro = (n) => `${n.toFixed(2)} €`;

function planCard(plan) {
  const date = new Date(plan.updatedAt).toLocaleDateString();
  return el("div", { class: "card", onclick: () => showPlan(plan.id) },
    el("h2", {}, plan.name),
    el("div", { class: "meta" }, `${plan.meals.length} meals · ${date}`),
    el("div", {}, `To buy ${euro(plan.toBuy.total)}`),
    el("div", { class: "chips" },
      el("span", { class: "chip" }, plan.balance.balanced ? "Balanced" : "Needs balance"),
      plan.budget !== undefined
        ? el("span", { class: "chip" }, plan.toBuy.total <= plan.budget ? "Within budget" : "Over budget")
        : null,
    ),
  );
}

function renderPlans() {
  $("plan-grid").replaceChildren(...plans.map(planCard));
  const empty = $("plan-empty");
  empty.classList.toggle("hidden", plans.length > 0);
  empty.textContent = "No meal plans saved yet. Ask Claude to plan a week and save it.";
}

async function loadPlans() {
  plans = (await api("api/plans")).plans;
  plans.sort((a, b) => b.updatedAt.localeCompare(a.updatedAt));
  renderPlans();
}

function groupByAisle(lines) {
  const groups = new Map();
  for (const line of lines) {
    const aisle = line.location?.aisle ? line.location.aisle : "";
    if (!groups.has(aisle)) groups.set(aisle, []);
    groups.get(aisle).push(line);
  }
  return [...groups.entries()].sort(([a], [b]) => {
    if (a === "" || b === "") return a === "" ? 1 : -1;
    return Number(a) - Number(b) || a.localeCompare(b);
  });
}

function showPlan(id) {
  const plan = plans.find((p) => p.id === id);
  if (!plan) return;
  tab = "plans";
  show("plan-detail-view");
  const view = $("plan-detail-view");
  const checked = new Set(plan.checked);
  const progress = el("span", { class: "meta" });
  const allLines = [...plan.toBuy.lines, ...plan.pantry.lines];
  const updateProgress = () => {
    progress.textContent = `${checked.size} of ${allLines.length} ticked`;
  };

  const persist = async () => {
    try {
      const updated = await api(`api/plans/${encodeURIComponent(id)}/checked`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ checked: [...checked] }),
      });
      plans = plans.map((p) => (p.id === id ? updated : p));
    } catch (error) {
      progress.textContent = `Could not save: ${error.message}`;
    }
  };

  const lineRow = (line) => {
    const box = el("input", { type: "checkbox" });
    box.checked = checked.has(line.productId);
    const row = el("label", { class: box.checked ? "line done" : "line" },
      box,
      el("span", { class: "text" },
        `${line.packages} × ${line.product}`,
        el("div", { class: "meta" }, `${line.ingredient}: need ${line.needed}`),
      ),
      el("span", { class: "price" }, euro(line.cost)),
    );
    box.addEventListener("change", () => {
      if (box.checked) checked.add(line.productId);
      else checked.delete(line.productId);
      row.classList.toggle("done", box.checked);
      updateProgress();
      persist();
    });
    return row;
  };

  const listSection = (title, list) => {
    if (list.lines.length === 0) return null;
    return el("div", {},
      el("h3", {}, `${title} · ${euro(list.total)}`),
      groupByAisle(list.lines).map(([aisle, lines]) =>
        el("div", {},
          el("div", { class: "aisle" }, aisle ? `Aisle ${aisle}` : "Aisle unknown"),
          lines.map(lineRow),
        ),
      ),
    );
  };

  const meals = plan.meals.map((meal) => {
    const n = meal.nutrition;
    const info = [
      `${meal.servings} servings`,
      n ? `${Math.round(n.kcal)} kcal · ${Math.round(n.proteinG)} g protein` : null,
    ].filter(Boolean).join(" · ");
    const known = meal.recipe && recipes.some((r) => r.id === meal.recipe);
    return el("li", {},
      el("strong", {}, meal.name),
      " ",
      meal.protein ? el("span", { class: "chip" }, PROTEIN_LABEL[meal.protein]) : null,
      meal.vegetables ? el("span", { class: "chip" }, "Vegetables") : null,
      el("div", { class: "meta" }, info),
      known ? el("button", { onclick: () => showDetail(meal.recipe) }, "View recipe") : null,
    );
  });

  const budgetLine = plan.budget === undefined
    ? null
    : plan.toBuy.total <= plan.budget
      ? el("span", { class: "stat ok" }, `${euro(plan.budget - plan.toBuy.total)} under the ${euro(plan.budget)} budget`)
      : el("span", { class: "stat issue" }, `${euro(plan.toBuy.total - plan.budget)} over the ${euro(plan.budget)} budget`);
  const avg = plan.nutrition.average;

  view.replaceChildren(
    el("div", { class: "row" }, el("button", { onclick: closePlan }, "← Back")),
    el("div", { class: "detail" },
      el("h2", {}, plan.name),
      el("div", { class: "meta" }, `${plan.store.chain} store ${plan.store.storeId} · saved ${new Date(plan.updatedAt).toLocaleDateString()}`),
      el("div", { class: "row" },
        el("span", { class: "stat" }, `To buy ${euro(plan.toBuy.total)}`),
        budgetLine,
        el("span", { class: "stat" }, `Pantry ${euro(plan.pantry.total)}`),
        avg ? el("span", { class: "stat" }, `Avg ${avg.kcalPerPortion} kcal · ${avg.proteinPerPortionG} g protein`) : null,
      ),
      plan.balance.balanced
        ? el("div", { class: "ok" }, "Balanced week")
        : el("div", {}, plan.balance.issues.map((issue) => el("div", { class: "issue" }, issue))),
      el("h3", {}, "Meals"),
      el("ul", { class: "ing" }, meals),
      el("div", { class: "row" }, el("h3", { style: "margin:0" }, "Shopping list"), progress),
      listSection("To buy", plan.toBuy),
      listSection("Pantry check", plan.pantry),
      el("div", { class: "row" },
        el("button", { class: "danger", onclick: () => removePlan(plan) }, "Delete plan"),
      ),
    ),
  );
  updateProgress();
  window.scrollTo(0, 0);
}

function closePlan() {
  tab = "plans";
  show("plans-view");
  renderPlans();
}

async function removePlan(plan) {
  if (!confirm(`Delete "${plan.name}"? This cannot be undone.`)) return;
  await api(`api/plans/${encodeURIComponent(plan.id)}`, { method: "DELETE" });
  plans = plans.filter((p) => p.id !== plan.id);
  closePlan();
}

$("tab-recipes").addEventListener("click", closeDetail);
$("tab-plans").addEventListener("click", async () => {
  tab = "plans";
  show("plans-view");
  await loadPlans().catch((error) => {
    $("plan-empty").classList.remove("hidden");
    $("plan-empty").textContent = `Could not load meal plans: ${error.message}`;
  });
});

for (const id of ["search", "tag", "protein", "sort"]) $(id).addEventListener("input", renderList);
load().catch((error) => {
  const empty = $("empty");
  empty.classList.remove("hidden");
  empty.textContent = `Could not load recipes: ${error.message}`;
});
</script>
</body>
</html>
